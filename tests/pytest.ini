# pytest configuration for the heterogeneous chiplet suite (Tests area).
#
# Markers are ALSO registered in tests/conftest.py:pytest_configure(), which is
# the authoritative registration — conftest always loads, whereas this ini is
# only picked up when pytest is invoked with `tests/` (or a path inside it) as
# an argument. The duplication here exists so `--strict-markers` and the default
# addopts apply on the normal `pytest tests/` invocation.
#
# If host/pyproject.toml later grows a [tool.pytest.ini_options] table, delete
# this file rather than maintaining both.

[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --strict-config
    -ra
    --showlocals
    --durations=10

# Turn any unexpected warning into a visible signal rather than scrollback.
filterwarnings =
    default

markers =
    hardware: needs at least one real KR260 (skipped when none is configured)
    single_board: runs against one die at a time; no cross-die traffic
    pair: needs both dies of a configured pair
    data_plane: pushes transactions ACROSS the D2D link - WEDGE RISK, deselected unless --data-plane
    soak: sustained cross-die load - WEDGE RISK, deselected unless --data-plane
    peer_read: reads back over the link (most wedge-prone); needs --allow-peer-read
    slow: minutes, not seconds (deploy / POR / soak)
    nongating: diagnostic - a failure is a known gap, not a silicon regression
    l0: L0 - pure host logic, no hardware, always runs in CI
    l1: L1 - one board, read-only probes
    l2: L2 - one board, config-plane writes
    l3: L3 - two boards, link bring-up + control plane
    l4: L4 - two boards, cross-die data plane (HIGH wedge risk)
    l5: L5 - two boards, soak / characterisation (HIGH wedge risk)
    l6: L6 - blocked on firmware or a new port; skips with the blocker named
